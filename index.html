<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PerakitPC TJKT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f4fd8">
<meta name="description" content="Simulasi perakitan PC dan pengenalan komponen komputer untuk siswa SMK TJKT.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Konsep: lembar kerja teknisi. Kertas abu-biru dingin, tinta biru, papan PCB hijau sebagai satu-satunya area berwarna jenuh. */
:root{
  --bg:#edf0f5; --surface:#ffffff; --surface2:#f4f6fa; --fg:#0f1826; --muted:#586477; --line:#d3d9e3;
  --accent:#1f4fd8; --accent-ink:#ffffff; --accent-soft:#e4ebff; --accent-a:rgba(31,79,216,.14);
  --ok:#0e7447; --ok-soft:#ddf4e7; --warn:#97580a; --warn-soft:#fff0d3; --bad:#b3261e; --bad-soft:#fde7e4;
  --pcb:#2b7a5b; --pcb-trace:#58b894; --pcb-edge:#1c5740; --case-fill:#dde3ec; --case-line:#8793a6;
  --mat:#c9d3e0; --slot:#101c2c; --slot-line:#3a4a63; --lbl:#e9f5ef; --lbl-out:#33425a;
  --ram:#2f6bff; --ssd:#12333a; --cooler:#a8b3c4; --psu:#2d3748; --vga:#222c3c; --cable24:#d98a0b; --cable8:#6d4bd8; --cablefp:#e0457b;
  --screen:#07111f; --screen-fg:#9df0c0;
  --f-head:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1119; --surface:#131b27; --surface2:#19232f; --fg:#e6ebf3; --muted:#92a0b4; --line:#273244;
  --accent:#7a9dff; --accent-ink:#0a1020; --accent-soft:#1a2a52; --accent-a:rgba(122,157,255,.16);
  --ok:#52d391; --ok-soft:#10301f; --warn:#f0b35a; --warn-soft:#352610; --bad:#ff8a80; --bad-soft:#3a1714;
  --pcb:#1d5a43; --pcb-trace:#3f9a78; --pcb-edge:#123c2d; --case-fill:#1b2431; --case-line:#52627a;
  --mat:#202c3b; --slot:#070d16; --slot-line:#42557a; --lbl:#cfe9dd; --lbl-out:#a8b6cb;
  --ram:#5b8aff; --ssd:#0d2a30; --cooler:#6b778a; --psu:#0f1722; --vga:#0c121b; --cable24:#f0a62e; --cable8:#9a82ff; --cablefp:#ff6ea0;
  --screen:#030a14; --screen-fg:#8cf0b8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1119; --surface:#131b27; --surface2:#19232f; --fg:#e6ebf3; --muted:#92a0b4; --line:#273244;
  --accent:#7a9dff; --accent-ink:#0a1020; --accent-soft:#1a2a52; --accent-a:rgba(122,157,255,.16);
  --ok:#52d391; --ok-soft:#10301f; --warn:#f0b35a; --warn-soft:#352610; --bad:#ff8a80; --bad-soft:#3a1714;
  --pcb:#1d5a43; --pcb-trace:#3f9a78; --pcb-edge:#123c2d; --case-fill:#1b2431; --case-line:#52627a;
  --mat:#202c3b; --slot:#070d16; --slot-line:#42557a; --lbl:#cfe9dd; --lbl-out:#a8b6cb;
  --ram:#5b8aff; --ssd:#0d2a30; --cooler:#6b778a; --psu:#0f1722; --vga:#0c121b; --cable24:#f0a62e; --cable8:#9a82ff; --cablefp:#ff6ea0;
  --screen:#030a14; --screen-fg:#8cf0b8;
  color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{display:inline-block;flex:none;vertical-align:middle}
.wrap{max-width:1240px;margin-inline:auto}
.mono{font-family:var(--f-mono)}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1240px;margin-inline:auto;display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:18px;font-weight:700;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.hdr-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2);border-color:var(--case-line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{min-height:36px;padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.tabs{display:flex;gap:4px;padding-top:14px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px 10px 0 0;font-family:var(--f-head);font-weight:600;font-size:16px;color:var(--muted);border:1px solid transparent;border-bottom:0}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);border-color:var(--line);position:relative;box-shadow:0 1px 0 var(--surface)}
.tab:hover{color:var(--fg)}
.main{background:var(--surface);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:clamp(14px,2.4vw,26px);margin-bottom:28px}

.sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{padding:9px 14px;min-height:42px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:clamp(20px,3vw,26px)}
.sec-h p{color:var(--muted);max-width:62ch;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;min-width:120px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hw{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0;transition:border-color .15s,transform .15s}
.hw:hover{border-color:var(--accent);transform:translateY(-2px)}
.hw .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hw .ico{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.hw h3{font-size:16px;font-weight:600}
.hw p{font-size:13.5px;color:var(--muted)}
.hw .go{margin-top:auto;font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:6px}

.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(6,12,22,.62);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--surface);color:var(--fg);width:min(760px,100%);max-height:92dvh;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;border:1px solid var(--line);padding:20px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.modal-bg{align-items:center;padding:24px}.modal{border-radius:16px;padding:24px 26px}}
.modal-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;margin-bottom:14px}
.modal-h h2{font-size:22px}
.mico{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.modal h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.modal p,.modal li{font-size:15px}
.modal ul{margin:0;padding-left:20px;display:grid;gap:6px}
dl.spec{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:0;margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
dl.spec dt,dl.spec dd{margin:0;padding:8px 12px;font-size:14px;border-top:1px solid var(--line)}
dl.spec dt:first-of-type,dl.spec dd:first-of-type{border-top:0}
dl.spec dt{background:var(--surface2);font-weight:600}
@media (max-width:520px){dl.spec{grid-template-columns:1fr}dl.spec dt{border-top:1px solid var(--line)}dl.spec dd{border-top:0}}
.k3{margin-top:16px;border-radius:10px;background:var(--warn-soft);color:var(--fg);padding:12px 14px;border-left:4px solid var(--warn)}
.k3 b{color:var(--warn);display:flex;align-items:center;gap:8px;margin-bottom:6px;font-family:var(--f-head)}
.k3 ul{padding-left:18px}
.link-sim{margin-top:16px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center}

.phases{display:grid;gap:10px}
.phase{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.phase>button{width:100%;display:flex;align-items:center;gap:12px;padding:14px;min-height:56px}
.phase .num{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;flex:none}
.phase.done .num{background:var(--ok-soft);color:var(--ok)}
.phase h3{font-size:16px;font-weight:600}
.phase .meta{font-size:12.5px;color:var(--muted)}
.phase .body{padding:0 14px 14px 14px;display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface2);min-height:44px}
.step input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.step label{display:block;cursor:pointer;min-width:0}
.step b{display:block;font-size:14.5px}
.step span{display:block;font-size:13.5px;color:var(--muted)}
.step.on{opacity:.75}
.step.on b{text-decoration:line-through;text-decoration-color:var(--muted)}

.simbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);min-width:84px}
.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.simgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"tray" "stage" "side"}
@media (min-width:1000px){.simgrid{grid-template-columns:230px minmax(0,1fr) 280px;grid-template-areas:"tray stage side";align-items:start}}
@media (min-width:700px) and (max-width:999px){.simgrid{grid-template-columns:210px minmax(0,1fr);grid-template-areas:"tray stage" "side side";align-items:start}}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;min-width:0}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tray{grid-area:tray}.stage{grid-area:stage}.side{grid-area:side;display:grid;gap:12px}
.k3list{display:grid;gap:6px;margin-bottom:12px}
.k3b{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-size:13.5px;font-weight:500;width:100%}
.k3b[aria-pressed="true"]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.k3b .bx{width:20px;height:20px;border-radius:5px;border:2px solid var(--case-line);display:grid;place-items:center;flex:none}
.k3b[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chips{display:grid;gap:6px}
@media (max-width:699px){.chips{display:flex;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;margin-inline:-2px;padding-inline:2px}.chips>*{scroll-snap-align:start}}
.chip{display:flex;align-items:center;gap:10px;min-height:46px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;width:100%;position:relative;transition:border-color .12s,background .12s}
@media (max-width:699px){.chip{width:auto;flex:none;white-space:nowrap}}
.chip:hover{border-color:var(--accent)}
.chip .ico{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.2}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.chip.used{opacity:.55;background:var(--surface2)}
.chip.used .ico{background:var(--ok-soft);color:var(--ok)}
.chip.next::after{content:"";position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}

.fb{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:14px;border-left:4px solid var(--line);background:var(--surface2);min-height:58px}
.fb b{display:block;font-family:var(--f-head);font-size:14.5px;margin-bottom:1px}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}.fb.ok .ic{color:var(--ok)}
.fb.err{background:var(--bad-soft);border-color:var(--bad)}.fb.err .ic{color:var(--bad)}
.fb.warn{background:var(--warn-soft);border-color:var(--warn)}.fb.warn .ic{color:var(--warn)}
.fb.info{background:var(--accent-soft);border-color:var(--accent)}.fb.info .ic{color:var(--accent)}
.view3d{position:relative;width:100%;height:clamp(360px,64vh,660px);border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.view3dwrap{position:relative}
.camover{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 16px);z-index:2}
.cbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:12.5px;font-weight:600;opacity:.94}
.cbtn:hover{border-color:var(--accent)}
.cbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.padover{position:absolute;left:8px;bottom:8px;display:grid;gap:6px;justify-items:start;z-index:2}
.padover .seg button{min-height:34px;padding:6px 10px;font-size:12.5px;background:var(--surface)}
.padover .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,38px);gap:4px}
.dpad .cbtn{padding:0;justify-content:center;min-height:38px;width:38px}
.dpad .up{grid-column:2;grid-row:1}.dpad .lf{grid-column:1;grid-row:2}.dpad .dn{grid-column:2;grid-row:2}.dpad .rt{grid-column:3;grid-row:2}
.r90{transform:rotate(90deg)}.r180{transform:rotate(180deg)}.r270{transform:rotate(270deg)}
.stepl{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:12.5px}
.stepl li{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;color:var(--muted)}
.stepl li.d{color:var(--ok)}
.stepl li.c{background:var(--accent-soft);color:var(--fg);font-weight:600}
.stepl .sn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);flex:none}
.stepl li.d .sn{background:var(--ok-soft);border-color:transparent}
.stepl li.c .sn{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.errl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
.errl li{background:var(--surface);border-radius:8px;padding:8px 10px;border-left:3px solid var(--bad)}
.errl b{display:block;font-size:13px}.errl small{color:var(--muted);display:block}
.camrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.camrow>span{font-size:12.5px;color:var(--muted);margin-right:2px}
.tip3d{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.board-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
svg.board{display:block;width:100%;min-width:540px;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.board .deco{pointer-events:none}
.board .lbl{font-family:var(--f-mono);font-size:12px;fill:var(--lbl);pointer-events:none}
.board .lbl.out{fill:var(--lbl-out)}
.board .lbl.big{font-size:14px;font-weight:600}
.board .tgt{cursor:pointer}
.board .hit{fill:transparent}
.board .ring{fill:none;stroke:transparent;stroke-width:2.5;rx:6}
.board .armed .ring{stroke:var(--accent);stroke-opacity:.45;stroke-dasharray:5 4}
.board .tgt:hover .ring{stroke:var(--accent);stroke-opacity:1;stroke-dasharray:none;fill:var(--accent-a)}
.board .tgt:focus-visible .ring{stroke:var(--accent);stroke-opacity:1;stroke-dasharray:none}
.board .tgt.glow .ring{stroke:var(--accent);stroke-opacity:1;stroke-dasharray:none;fill:var(--accent-a);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:5;fill:transparent}}
.board .tgt.hidden{display:none}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Tampilan layar HP ===== */
@media (max-width:699px){
  body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .hdr{position:static;margin-inline:calc(-1*max(10px,env(safe-area-inset-left,0px)));padding-inline:max(10px,env(safe-area-inset-left,0px))}
  .hdr-in{padding-block:8px;gap:8px}
  .brand{flex:1 1 auto}.brand small{display:none}.brand h1{font-size:16px}.logo{width:32px;height:32px;border-radius:8px}
  .hdr-act{gap:6px;flex:1 1 100%;justify-content:space-between;flex-wrap:nowrap}
  .hdr-act .btn{min-height:38px;padding:6px 10px;font-size:13px}
  .tabs{padding-top:8px;gap:3px;flex-wrap:nowrap}

<script id="logic">
(function(){

/* ---------- Definisi komponen & target simulasi ---------- */
var ITEMS={
  mobo:{nama:'Motherboard',sub:'Papan induk',ikon:'mobo',tujuan:'meja kerja (di luar casing), lalu bay motherboard di casing',
    why:'Motherboard diletakkan dulu di atas alas anti-statis, lalu dipindahkan ke bay motherboard casing setelah komponen utamanya terpasang.'},

    why:'CPU memiliki pola kontak yang hanya cocok dengan socket CPU. Slot lain memiliki bentuk, jumlah pin, dan fungsi berbeda, sehingga CPU tidak akan muat atau malah merusak kontak jika dipaksa.'},
  paste:{nama:'Thermal Paste',sub:'Pasta termal',ikon:'drop',tujuan:'permukaan CPU (area socket CPU)',

  psu:{nama:'Power Supply (PSU)',sub:'Catu daya',ikon:'zap',tujuan:'bay PSU di bagian bawah casing',

  vga:{nama:'VGA Card / GPU',sub:'Kartu grafis',ikon:'gpu',tujuan:'slot PCIe x16',

  c24:{nama:'Kabel 24-pin ATX',sub:'Daya motherboard',ikon:'plug',tujuan:'konektor 24-pin ATX di tepi kanan motherboard',
    why:'Konektor 24-pin berbentuk persegi panjang dengan pengunci (clip). Setiap konektor daya hanya cocok dengan bentuk dan jumlah pin tertentu.'},
  c8:{nama:'Kabel CPU 8-pin',sub:'Daya processor (EPS)',ikon:'plug',tujuan:'konektor CPU 8-pin (EPS) di tepi atas motherboard',
    why:'Kabel EPS 8-pin menyalurkan daya khusus ke CPU dan dicolokkan ke konektor 4+4 pin di dekat socket CPU.'},
  fp:{nama:'Kabel Front Panel',sub:'Tombol & LED casing',ikon:'cable',tujuan:'header Front Panel di tepi bawah motherboard',
    why:'Kabel tombol dan lampu casing disambungkan ke header Front Panel (F_PANEL) di tepi bawah motherboard.'}
};
var ORDER=['mobo','cpu','paste','cooler','ram','ssd','io','psu','vga','c24','c8','fp'];
var TARGETS={
  bench:'Meja kerja', caseBay:'Casing (bay motherboard)', socket:'Socket CPU',
  dimm0:'DIMM A1', dimm1:'DIMM A2', dimm2:'DIMM B1', dimm3:'DIMM B2',
  m2:'Slot M.2', pcie:'Slot PCIe x16', io:'Lubang I/O casing', psuBay:'Bay PSU',
  atx24:'Konektor 24-pin ATX', eps:'Konektor CPU 8-pin', fph:'Header Front Panel'
};
var FP={
  PWR_SW:{sock:'PWR_BTN',fungsi:'tombol power',warna:'#e0457b'},
  RESET_SW:{sock:'RESET',fungsi:'tombol reset',warna:'#d98a0b'},
  HDD_LED:{sock:'HDD+ / HDD-',fungsi:'lampu aktivitas penyimpanan',warna:'#1f9d6b'},
  PWR_LED:{sock:'PLED+ / PLED-',fungsi:'lampu indikator power',warna:'#2f6bff'}
};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function newState(){
  return {k3:{esd:false,mat:false,tool:false},mobo:'tray',cpu:false,paste:false,cooler:false,
    ram:[false,false,false,false],ssd:false,io:false,psu:false,vga:false,c24:false,c8:false,fp:false,
    fpOrder:shuffle(['PWR_SW','RESET_SW','HDD_LED','PWR_LED'])};
}
function ramCount(S){return S.ram.filter(Boolean).length}
function k3ok(S){return S.k3.esd&&S.k3.mat&&S.k3.tool}
function fail(title,msg){return {ok:false,title:title,msg:msg}}
function ok(S,title,msg,extra){var r={ok:true,S:S,title:title,msg:msg};if(extra)for(var k in extra)r[k]=extra[k];return r}
function upd(S,o){var n={};for(var k in S)n[k]=S[k];for(var k2 in o)n[k2]=o[k2];return n}

/* ---------- Validasi urutan teknis ---------- */
function attempt(S,item,target){
  var it=ITEMS[item];
  var wrongSlot=function(){return fail('Slot tidak sesuai',it.nama+' tidak dipasang di "'+TARGETS[target]+'". '+it.why+' Tempat yang benar: '+it.tujuan+'.')};
  switch(item){
    case 'mobo':
      if(target==='bench'){
        if(S.mobo!=='tray')return fail('Motherboard sudah di meja kerja','Motherboard sudah berada di atas alas kerja. Lanjutkan memasang komponen di atasnya.');
        return ok(upd(S,{mobo:'bench'}),'Motherboard diletakkan','Motherboard ditaruh di atas alas anti-statis (bisa memakai kardus box motherboard). Jangan taruh langsung di atas meja logam. Lanjut: pasang CPU.');
      }
      if(target==='caseBay'){
        if(S.mobo==='tray')return fail('Motherboard belum di meja kerja','Letakkan motherboard di meja kerja terlebih dahulu, lalu pasang CPU, pasta termal, cooler, RAM, dan SSD di luar casing.');
        if(S.mobo==='case')return fail('Sudah di casing','Motherboard sudah terpasang di casing.');
        var miss=[];if(!S.cpu)miss.push('CPU');if(!S.paste)miss.push('pasta termal');if(!S.cooler)miss.push('CPU cooler');if(ramCount(S)<1)miss.push('RAM');if(!S.ssd)miss.push('SSD NVMe');
        if(miss.length)return fail('Urutan SOP terlewat','Komponen berikut belum dipasang di motherboard: '+miss.join(', ')+'. Sesuai SOP, komponen kecil dipasang di luar casing karena ruang kerja lebih luas, tidak terhalang rangka casing, dan risiko pin CPU bengkok atau motherboard tertekan lebih kecil.');
        if(!S.io)return fail('I/O Shield belum dipasang','Pasang I/O Shield pada lubang belakang casing sebelum memasukkan motherboard. Jika motherboard sudah masuk, pelat ini tidak bisa dipasang karena terhalang konektor port, dan motherboard harus dibongkar lagi.');
        return ok(upd(S,{mobo:'case'}),'Motherboard masuk casing','Motherboard diturunkan ke bay casing, dicocokkan ke standoff kuningan, lalu dikencangkan dengan sekrup secara bersilangan. Pastikan tidak ada standoff berlebih di bawah papan karena bisa menyebabkan korsleting.');
      }
      return fail('Target salah','Motherboard dipasang di '+it.tujuan+'. Slot yang kamu pilih ("'+TARGETS[target]+'") adalah bagian yang berada di atas motherboard, bukan tempat meletakkannya.');
    case 'cpu':
      if(target!=='socket')return wrongSlot();
      if(S.mobo==='tray')return fail('Motherboard belum disiapkan','Letakkan motherboard di meja kerja dulu. CPU tidak boleh dipasang tanpa dudukan yang stabil karena pin socket mudah bengkok.');
      if(S.cpu)return fail('CPU sudah terpasang','Socket sudah terisi CPU.');
      return ok(upd(S,{cpu:true}),'CPU terpasang','Tuas socket diangkat, segitiga emas CPU disejajarkan dengan tanda segitiga pada socket, CPU diletakkan tanpa ditekan, lalu tuas dikunci. Jangan menyentuh pin atau kontak.');
    case 'paste':
      if(target!=='socket')return wrongSlot();
      if(!S.cpu)return fail('CPU belum dipasang','Pasta termal dioleskan pada permukaan CPU. Jika socket masih kosong, pasta akan mengotori pin socket yang sangat halus dan bisa menyebabkan hubungan pendek.');
      if(S.paste)return fail('Pasta sudah dioles','Pasta termal sudah ada. Pasta berlebih justru menjadi penghambat panas dan bisa meluber ke socket.');
      if(S.cooler)return fail('Cooler sudah terpasang','Pasta termal harus dioles sebelum cooler dipasang.');
      return ok(upd(S,{paste:true}),'Pasta termal dioles','Satu titik sebesar biji kacang polong di tengah CPU sudah cukup. Tekanan cooler akan menyebarkannya merata, mengisi celah mikroskopis antara CPU dan heatsink.');
    case 'cooler':
      if(target!=='socket')return wrongSlot();
      if(!S.cpu)return fail('CPU belum dipasang','Cooler menutupi seluruh area socket. Bila dipasang lebih dulu, CPU tidak bisa dimasukkan lagi tanpa membongkar cooler.');
      if(!S.paste)return fail('Pasta termal belum dioles','Tanpa pasta termal terdapat celah udara mikroskopis antara CPU dan heatsink. Udara penghantar panas yang buruk, sehingga CPU cepat panas, melambat (thermal throttling), dan bisa mati sendiri.');
      if(S.cooler)return fail('Cooler sudah terpasang','Cooler sudah menempel pada CPU.');
      return ok(upd(S,{cooler:true}),'CPU cooler terpasang','Cooler dikencangkan bertahap secara bersilangan agar tekanannya merata. Kabel kipas dicolokkan ke header CPU_FAN supaya kecepatan kipas terbaca BIOS.');
    case 'ram':
      if(target.indexOf('dimm')!==0)return wrongSlot();
      if(S.mobo==='tray')return fail('Motherboard belum disiapkan','Letakkan motherboard di meja kerja dulu agar tekanan saat memasang RAM tidak membuat papan melengkung.');
      var idx=parseInt(target.slice(4),10);
      if(S.ram[idx])return fail('Slot sudah terisi','Slot '+TARGETS[target]+' sudah terisi modul RAM.');
      var cnt=ramCount(S);
      if(cnt>=2)return fail('Cukup dua modul','Simulasi ini memakai maksimal dua modul RAM untuk konfigurasi Dual Channel.');
      if(cnt===0&&idx!==1)return fail('Slot prioritas salah','Jika hanya satu modul, manual motherboard umumnya meminta pemasangan di slot A2 (slot kedua dari socket CPU), bukan di '+TARGETS[target]+'. Slot ini adalah jalur utama yang diprioritaskan BIOS saat POST.');
      if(cnt===1&&idx!==3)return fail('Bukan pasangan Dual Channel','Agar aktif Dual Channel, modul kedua dipasang di slot B2 (slot keempat), berpasangan dengan A2. Memasang di slot sebelahnya membuat kedua modul berada di satu kanal sehingga bandwidth tidak berlipat.');
      var r2=S.ram.slice();r2[idx]=true;
      return ok(upd(S,{ram:r2}),cnt===0?'RAM terpasang di A2':'Dual Channel aktif','Modul diposisikan sehingga lekukan (notch) sejajar dengan sekat slot, lalu ditekan merata sampai kedua klip pengunci berbunyi klik.'+(cnt===0?' RAM kedua (opsional) dipasang di B2 untuk Dual Channel.':' Kecepatan memori kini berlipat karena dua kanal bekerja bersamaan.'));
    case 'ssd':
      if(target!=='m2')return wrongSlot();
      if(S.mobo==='tray')return fail('Motherboard belum disiapkan','Letakkan motherboard di meja kerja dulu sebelum memasang SSD.');
      if(S.ssd)return fail('Slot M.2 terisi','SSD NVMe sudah terpasang.');
      if(S.vga)return fail('Slot M.2 tertutup VGA','Pada banyak motherboard, slot M.2 berada tepat di bawah kartu grafis. Pasang SSD sebelum VGA, karena setelah VGA terpasang slotnya tertutup dan sekrup kecilnya sulit dijangkau.');
      return ok(upd(S,{ssd:true}),'SSD NVMe terpasang','SSD dimasukkan miring sekitar 30 derajat, ditekan rata, lalu dikunci dengan sekrup M.2. Lepas lapisan plastik pada thermal pad heatsink M.2 jika ada.');
    case 'io':
      if(target!=='io')return wrongSlot();
      if(S.io)return fail('I/O Shield sudah terpasang','Pelat I/O sudah terpasang di lubang belakang casing.');
      if(S.mobo==='case')return fail('Motherboard sudah di casing','I/O Shield dipasang dari sisi dalam sebelum motherboard masuk. Setelah motherboard terpasang, port-nya menghalangi pelat sehingga kamu harus membongkar lagi.');
      return ok(upd(S,{io:true}),'I/O Shield terpasang','Tekan pelat dari dalam casing hingga keempat sisinya klik. Cocokkan lubang pelat dengan susunan port di motherboard sebelum memasukkan motherboard.');
    case 'psu':
      if(target!=='psuBay')return wrongSlot();
      if(S.psu)return fail('PSU sudah terpasang','PSU sudah berada di bay-nya.');
      return ok(upd(S,{psu:true}),'PSU terpasang','PSU dikunci dengan empat sekrup. Pastikan saklar PSU berada pada posisi OFF dan kabel AC belum dicolok. Kipas PSU menghadap lubang udara casing.'+(S.mobo==='case'?'':' PSU boleh dipasang lebih dulu pada casing yang ruangnya lega, tetapi hati-hati agar kabelnya tidak menghalangi saat memasang motherboard.'));
    case 'vga':
      if(target!=='pcie')return wrongSlot();
      if(S.mobo!=='case')return fail('Motherboard belum di casing','VGA dipasang setelah motherboard terpasang di casing. Bracket logam VGA dikunci ke lubang slot casing dan kartu yang berat membutuhkan penopang rangka. Kartu yang dipasang di meja kerja bisa membengkokkan motherboard.');
      if(!S.ssd)return fail('SSD M.2 belum terpasang','Slot M.2 berada di bawah kartu grafis. Pasang SSD lebih dulu sebelum VGA menutupinya.');
      if(S.vga)return fail('VGA sudah terpasang','Slot PCIe x16 sudah terisi.');
      return ok(upd(S,{vga:true}),'VGA terpasang','Lepas penutup slot casing, tekan VGA lurus ke bawah sampai pengunci slot klik, lalu kencangkan bracket dengan sekrup. Daya tambahan PCIe dari PSU disambung terpisah sesuai kebutuhan kartu.');
    case 'c24':
      if(target!=='atx24')return wrongSlot();
      if(!S.psu)return fail('PSU belum terpasang','Kabel 24-pin berasal dari PSU. Tanpa PSU tidak ada sumber daya yang bisa disambungkan.');
      if(S.c24)return fail('Sudah terpasang','Kabel 24-pin sudah tersambung.');
      return ok(upd(S,{c24:true}),'Kabel 24-pin terpasang','Konektor ditekan sampai klip pengunci mengunci. Kabel ini memberi daya utama 3,3V, 5V, dan 12V ke motherboard.');
    case 'c8':
      if(target!=='eps')return wrongSlot();
      if(!S.psu)return fail('PSU belum terpasang','Kabel CPU 8-pin berasal dari PSU, jadi PSU harus terpasang lebih dulu.');
      if(S.c8)return fail('Sudah terpasang','Kabel CPU sudah tersambung.');
      return ok(upd(S,{c8:true}),'Kabel CPU 8-pin terpasang','Konektor EPS ditekan sampai klik. Jangan tertukar dengan kabel PCIe 8-pin milik VGA, karena bentuk pinnya mirip tetapi pengkabelannya berbeda.');
    case 'fp':
      if(target!=='fph')return wrongSlot();
      if(S.mobo!=='case')return fail('Motherboard belum di casing','Kabel tombol dan lampu berasal dari bagian depan casing, jadi motherboard harus terpasang di casing lebih dulu.');

  }
  return fail('Tidak dikenali','Aksi tidak dikenali.');
}

function isComplete(S){return S.mobo==='case'&&S.cpu&&S.paste&&S.cooler&&ramCount(S)>=1&&S.ssd&&S.io&&S.psu&&S.vga&&S.c24&&S.c8&&S.fp}

function power(S){
  if(S.mobo!=='case')return fail('Rakitan belum lengkap','Motherboard belum terpasang di casing sehingga tombol power casing tidak terhubung ke motherboard. Menyalakan papan di luar casing berisiko korsleting.');
  if(!S.psu)return fail('Tidak ada sumber daya','PSU belum terpasang. Tanpa catu daya, tidak ada listrik yang mengalir ke komponen manapun.');
  if(!S.c24)return fail('Motherboard tidak mendapat daya','Kabel 24-pin ATX belum terpasang. Tombol power hanya mengirim sinyal ke motherboard; tanpa daya standby dan daya utama dari kabel 24-pin, motherboard tidak merespons sama sekali.');
  if(!S.fp)return fail('Tombol power belum terhubung','Header Front Panel belum tersambung, jadi sinyal PWR_SW dari tombol casing tidak sampai ke motherboard. Teknisi biasanya menyalakan dengan menyentuh pin PWR_SW memakai obeng hanya untuk pengujian, bukan solusi akhir.');
  if(!S.c8)return fail('CPU tidak mendapat daya','Kabel CPU 8-pin (EPS) belum terpasang. Prosesor memerlukan jalur 12V khusus, tanpa itu sistem tidak mau menyala atau mati beberapa detik setelah hidup.');
  if(!S.vga)return fail('Tidak ada output video','VGA belum terpasang sehingga layar tidak mendapat sinyal. Komputer bisa saja menyala, tetapi POST menghasilkan bunyi beep error dan layar kosong.');

}

function goodTarget(S,item){
  switch(item){

    case 'cpu':case 'paste':case 'cooler':return 'socket';
    case 'ram':return ramCount(S)===0?'dimm1':'dimm3';
    case 'ssd':return 'm2';case 'io':return 'io';case 'psu':return 'psuBay';case 'vga':return 'pcie';
    case 'c24':return 'atx24';case 'c8':return 'eps';case 'fp':return 'fph';

}
function itemDone(S,item){
  switch(item){
    case 'mobo':return S.mobo==='case';
    case 'ram':return ramCount(S)>=2;
    default:return !!S[item];
  }
}

  if(!S.paste)return {item:'paste',text:'Pilih Thermal Paste, lalu ketuk CPU di socket.'};
  if(!S.cooler)return {item:'cooler',text:'Pilih CPU Cooler, lalu ketuk area CPU.'};
  if(ramCount(S)<1)return {item:'ram',text:'Pilih RAM, lalu ketuk slot DIMM A2 (slot kedua dari CPU).'};
  if(!S.ssd)return {item:'ssd',text:'Pilih SSD NVMe M.2, lalu ketuk Slot M.2.'};
  if(!S.io)return {item:'io',text:'Pilih I/O Shield, lalu ketuk lubang I/O di belakang casing.'};
  if(S.mobo!=='case')return {item:'mobo',text:'Pilih Motherboard lagi, lalu ketuk area casing untuk memindahkannya ke bay motherboard.'};
  if(!S.psu)return {item:'psu',text:'Pilih Power Supply, lalu ketuk Bay PSU di bawah casing.'};
  if(!S.vga)return {item:'vga',text:'Pilih VGA Card, lalu ketuk Slot PCIe x16.'};
  if(!S.c24)return {item:'c24',text:'Pilih Kabel 24-pin ATX, lalu ketuk konektor 24-pin motherboard.'};
  if(!S.c8)return {item:'c8',text:'Pilih Kabel CPU 8-pin, lalu ketuk konektor 8-pin di dekat CPU.'};
  if(!S.fp)return {item:'fp',text:'Pilih Kabel Front Panel, lalu ketuk header Front Panel dan cocokkan keempat kabelnya.'};

function swMain(){

  var caseG=new T.Group();scene.add(caseG);
  box(caseG,46,1,44,M(0x39414f,{metalness:.5,roughness:.5}),CX,.5,CZ);

  box(caseG,47.2,18,.8,M(0x4d586b,{metalness:.4,transparent:true,opacity:.55}),CX,10,CZ-22.4);

  var cf2=makeFan(5.5,1,0x4d6fa8);cf2.position.set(CX+22.3,10,CZ-1);cf2.rotation.y=-Math.PI/2;caseG.add(cf2);

  function selectable(p){if(p.key==='paste'&&p.used)return false;return p.loc==='home'||(p.key==='mobo'&&p.loc==='bench')}

    var hs=ray.intersectObjects(roots,true);
    for(var i=0;i<hs.length;i++){

  function isCable(p){return p.key==='c24'||p.key==='c8'||p.key==='fp'}
    /* Rak 1 (komponen): otomatis aktif setelah motherboard diletakkan di alas anti-statis.

  function rack1Done(){

  function updateDock(dt){
    var k=1-Math.exp(-dt*11);
    var fwd=controls.target.clone().sub(camera.position);var dist=Math.max(fwd.length(),1);fwd.normalize();
    var right=new T.Vector3().crossVectors(fwd,camera.up).normalize();
    var upS=new T.Vector3().crossVectors(right,fwd).normalize();
    var dd=Math.max(5,dist*.55);
    var halfH=Math.tan(camera.fov*Math.PI/360)*dd,halfW=halfH*camera.aspect;
    var center=camera.position.clone().add(fwd.clone().multiplyScalar(dd));
    var narrow=camera.aspect<1,tile=narrow?Math.min(halfH*.19,halfW*.2):Math.min(halfH*.22,halfW*.14);
    var cols=narrow?[.56,.86]:[.52,.74,.94],ncol=cols.length;
    function ndc(x,y){return center.clone().add(right.clone().multiplyScalar(x*halfW)).add(upS.clone().multiplyScalar(y*halfH))}
    function drive(p,pos,quat,size){
      if(p.noFollow||dragging===p)return;
      var s=Math.min(1.5,size/p.maxDim);
      var off=p.localCenter.clone().applyQuaternion(quat).multiplyScalar(s);
      var tp=pos.clone().sub(off);
      p.root.position.lerp(tp,k);p.root.quaternion.slerp(quat,k);
      var ns=p.root.scale.x+(s-p.root.scale.x)*k;p.root.scale.set(ns,ns,ns);
    }

      if(p.noFollow||dragging===p)return;
      p.root.position.lerp(pos,k);p.root.quaternion.slerp(quat,k);
      var ns=p.root.scale.x+(1-p.root.scale.x)*k;p.root.scale.set(ns,ns,ns);
    }

    dockOrder.forEach(function(key){
      var p=P[key];if(p.loc!=='home')return;
      var useDock=isDocked(p);
      if(p===selPart){
        if(useDock)drive(p,ndc(narrow?.7:.74,.70),ID,tile*1.6);
        else settle(p,p.home.pos.clone().add(V(0,3,0)),p.home.quat);
        return;
      }
      if(useDock){

      rgbs.forEach(function(m){m.emissive.setHSL((now*.0003)%1,1,.5)});
    }
    Object.keys(hits).forEach(function(id){
      var h=hits[id],m=h.mesh.material,e=h.edges.material;

        else if(practice&&armed&&hint===id){tgt=.2+.16*Math.sin(now*.007);edge=1;col=0x22c55e}
      }

    });

      p.label.visible=show;
      if(show){p.label.position.set(p.root.position.x,p.home.top+2.6,p.root.position.z)}
    });
    if(tweens.length||dragging||cableDirty>0){updateCables();if(cableDirty>0)cableDirty--}
    /* Di Rak 2 hanya kepala kabel yang tampil; badan kabel baru terlihat dan bergerak saat kabel diseret atau dipasang. */
    cables.forEach(function(c){var q=P[c.key];c.mesh.visible=!(q.loc==='home'&&isDocked(q)&&!q.noFollow&&dragging!==q)});
    controls.update();
    updateDock(dt);
    renderer.render(scene,camera);
  }
  api.setTheme(false);
  api.sync(null===null?{mobo:'tray',cpu:false,paste:false,cooler:false,ram:[false,false,false,false],ssd:false,io:false,psu:false,vga:false,c24:false,c8:false,fp:false}:null);
  updateCables();
  raf=requestAnimationFrame(frame);

  api._debug=function(){return{P:P,camera:camera,controls:controls,cables:cables}};
  api.dispose=function(){
    alive=false;cancelAnimationFrame(raf);clearInterval(screenState.timer);
    if(ro)ro.disconnect();else window.removeEventListener('resize',resize);
    controls.dispose();renderer.dispose();
    if(canvas.parentNode)canvas.parentNode.removeChild(canvas);
  };
  return api;
}
window.Scene3D={create:create,supported:supported};
})();

/* ---------- Util ---------- */
function fmtTime(s){var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function fmtDate(iso){try{var d=new Date(iso);return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}catch(e){return iso}}

function Modal(p){
  useEffect(function(){
    var f=function(e){if(e.key==='Escape')p.onClose()};
    window.addEventListener('keydown',f);
    var prev=document.body.style.overflow;document.body.style.overflow='hidden';
    return function(){window.removeEventListener('keydown',f);document.body.style.overflow=prev};
  },[]);
  return html`<div className="modal-bg" onClick=${function(e){if(e.target===e.currentTarget)p.onClose()}}>
    <div className="modal" role="dialog" aria-modal="true" aria-label=${p.label}>${p.children}</div>
  </div>`;
}

function Materi(p){
  var prog=p.prog;
  var _s=useState('hw'),sub=_s[0],setSub=_s[1];
  var _o=useState(null),open=_o[0],setOpen=_o[1];
  var _e=useState({p1:true}),exp=_e[0],setExp=_e[1];
  var read=prog.dibaca||[];
  var done=prog.sop||{};
  var totalSteps=SOP.reduce(function(a,b){return a+b.steps.length},0);
  var doneSteps=Object.keys(done).filter(function(k){return done[k]}).length;
  function openHW(h){setOpen(h);if(read.indexOf(h.id)<0)p.setProg(function(o){return Object.assign({},o,{dibaca:(o.dibaca||[]).concat([h.id])})})}
  function toggleStep(k){p.setProg(function(o){var s=Object.assign({},o.sop||{});s[k]=!s[k];return Object.assign({},o,{sop:s})})}
  return html`<div>
    <div className="sub">
      <div className="seg" role="group" aria-label="Sub-menu materi">
        <button aria-pressed=${sub==='hw'} onClick=${function(){setSub('hw')}}><${Icon} n="cpu" s=${17}/> Pengenalan Komponen</button>
        <button aria-pressed=${sub==='sop'} onClick=${function(){setSub('sop')}}><${Icon} n="shield" s=${17}/> SOP Perakitan (K3LH)</button>
      </div>
    </div>
    ${sub==='hw'?html`<div>
      <div className="sec-h">
        <div><h2>Pengenalan Komponen Perangkat Keras</h2><p>Ketuk kartu untuk membaca fungsi, cara kerja, spesifikasi penting, dan tips pemasangan yang aman.</p></div>
        <div style=${{minWidth:180}}><div style=${{fontSize:13,marginBottom:4}} className="mono">${read.length} / ${HW.length} dibaca</div><div className="bar"><i style=${{width:(read.length/HW.length*100)+'%'}}></i></div></div>
      </div>
      <div className="cards">${HW.map(function(h){
        var r=read.indexOf(h.id)>=0;
        return html`<button key=${h.id} className="hw" onClick=${function(){openHW(h)}}>
          <div className="top"><div className="ico"><${Icon} n=${h.ikon} s=${24}/></div>${r?html`<span className="pill ok"><${Icon} n="check" s=${13}/> Dibaca</span>`:html`<span className="pill">Baru</span>`}</div>
          <h3>${h.nama}</h3><p>${h.ringkas}</p>
          <span className="go">Buka detail <${Icon} n="chevron" s=${15} cls="-rotate-90"/></span>
        </button>`})}</div>
    </div>`:html`<div>
      <div className="sec-h">
        <div><h2>Panduan dan SOP Perakitan PC (K3LH)</h2><p>Ikuti urutan ini agar perakitan aman dan hasilnya benar. Centang langkah yang sudah kamu pahami.</p></div>
        <div style=${{minWidth:180}}><div style=${{fontSize:13,marginBottom:4}} className="mono">${doneSteps} / ${totalSteps} langkah</div><div className="bar"><i style=${{width:(doneSteps/totalSteps*100)+'%'}}></i></div></div>
      </div>
      <div className="phases">${SOP.map(function(ph,pi){
        var n=ph.steps.filter(function(_,i){return done[ph.id+'.'+i]}).length;
        var all=n===ph.steps.length;var isOpen=!!exp[ph.id];
        return html`<div key=${ph.id} className=${'phase'+(all?' done':'')}>
          <button aria-expanded=${isOpen} onClick=${function(){setExp(function(e){var x=Object.assign({},e);x[ph.id]=!x[ph.id];return x})}}>
            <span className="num">${all?html`<${Icon} n="check" s=${18}/>`:(pi+1)}</span>
            <span style=${{flex:1,minWidth:0}}><h3>${ph.judul}</h3><span className="meta">${n} dari ${ph.steps.length} langkah</span></span>
            <${Icon} n="chevron" s=${20} cls=${isOpen?'rotate-180':''}/>
          </button>
          ${isOpen?html`<div className="body">${ph.steps.map(function(s,i){
            var k=ph.id+'.'+i;var on=!!done[k];
            return html`<div key=${k} className=${'step'+(on?' on':'')}>
              <input type="checkbox" id=${'sop-'+k} checked=${on} onChange=${function(){toggleStep(k)}}/>
              <label htmlFor=${'sop-'+k}><b>${s[0]}</b><span>${s[1]}</span></label></div>`})}</div>`:null}
        </div>`})}</div>
    </div>`}
    ${open?html`<${HWModal} h=${open} onClose=${function(){setOpen(null)}}/>`:null}
  </div>`;
}

function Sim(p){

  var _sel=useState(null),sel=_sel[0],setSel=_sel[1];
  var _fb=useState({kind:'info',title:'Selamat datang di simulasi',msg:'Mulai dengan checklist K3LH, lalu seret komponen 3D ke slot tujuannya (atau ketuk komponen, lalu ketuk slot).'}),fb=_fb[0],setFb=_fb[1];
  var _er=useState(0),errors=_er[0],setErrors=_er[1];

  var practice=mode==='latihan';

  function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  var apiRef=useRef(null),cbs=useRef({});

  var _fl=useState(false),flat=_fl[0],setFlat=_fl[1];
  var sceneKey=[S.mobo,S.cpu,S.paste,S.cooler,S.ram.join(''),S.ssd,S.io,S.psu,S.vga,S.c24,S.c8,S.fp].join('|');

  useEffect(function(){
    if(!t0||done)return;
    var id=setInterval(function(){setNow(Date.now())},500);
    return function(){clearInterval(id)};
  },[t0,done]);
  useEffect(function(){AU.on=snd},[snd]);
  useEffect(function(){var a=A();if(a)a.sync(S)},[sceneKey,nonce,flat]);
  useEffect(function(){var a=A();if(a)a.setSelected(sel)},[sel,nonce]);
  useEffect(function(){var a=A();if(a)a.setOrder(order.map(function(i){return i}))},[order,nonce,flat]);
  var hintSlot=null;

  var elapsed=done?done.waktu:(t0?Math.floor((now-t0)/1000):0);
  var score=Math.max(0,100-pen);
  var k3done=SIM.k3ok(S);
  var k3count=(S.k3.esd?1:0)+(S.k3.mat?1:0)+(S.k3.tool?1:0);
  var next=SIM.nextStep(S);
  var ready=SIM.isComplete(S);
  var _fu=useState(false),full=_fu[0],setFull=_fu[1];
  var _ts=useState(null),toast=_ts[0],setToast=_ts[1];
  function toggleFull(){
    var v=!full;setFull(v);
    try{
      if(v){var el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement){var pr=el.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){})}}
      else if(document.fullscreenElement&&document.exitFullscreen){var p2=document.exitFullscreen();if(p2&&p2.catch)p2.catch(function(){})}
    }catch(e){}
  }
  useEffect(function(){
    if(!full)return;
    var ov=document.body.style.overflow;document.body.style.overflow='hidden';
    function key(e){if(e.key==='Escape')setFull(false)}
    function fsc(){if(!document.fullscreenElement)setFull(false)}
    window.addEventListener('keydown',key);document.addEventListener('fullscreenchange',fsc);
    return function(){document.body.style.overflow=ov;window.removeEventListener('keydown',key);document.removeEventListener('fullscreenchange',fsc)};
  },[full]);
  useEffect(function(){if(full){var a=apiRef.current;if(a&&a.resize)a.resize()}},[full]);

    if(judul){var tt=t0?Math.floor((Date.now()-t0)/1000):0;setLog(function(l){return l.concat([{t:tt,judul:judul,rincian:rincian||'',poin:n}])})}
  }
  function okFb(r){return exam?{kind:'ok',title:r.title,msg:'Komponen terpasang.'}:{kind:'ok',title:r.title,msg:r.msg}}
  var GENERIC={kind:'err',title:'Pelanggaran teknis dicatat',msg:'Pemasangan tidak sesuai prosedur atau slot yang dipilih salah. Skor berkurang 5. Periksa kembali urutan dan lokasi slot.'};
  function reset(m){
    setS(SIM.newState());setSel(null);setErrors(0);setPen(0);setT0(null);setDone(null);setFpOpen(false);
    setNonce(function(n){return n+1});setLog([]);setOrder(m==='ujian'?shuf(SIM.ORDER):SIM.ORDER);
    setFb({kind:'info',title:m==='ujian'?'Mode Ujian dimulai':'Perakitan direset',msg:m==='ujian'?'Tanpa petunjuk. Rakit PC dari awal secara mandiri sesuai SOP. Setiap pelanggaran dicatat dan mengurangi skor.':'Mulai lagi dari checklist K3LH.'});

    if(id==='mobo'&&S.mobo==='case')return;
    AU.tap();
    if(sel===id){setSel(null);return}
    setSel(id);
    setFb({kind:'info',title:SIM.ITEMS[id].nama+' dipilih',msg:practice?'Sekarang ketuk slot tujuannya. Slot yang benar sedang menyala.':'Temukan sendiri slot yang tepat di motherboard atau casing.'});
  }
  function onTarget(tid,fromDrag){
    if(done||(A()&&A().isBusy()))return;

    if(api){
      var item=sel;

    onSlotTap:function(sid){onTarget(sid,false)}

  function pressPower(){

    setDone({id:rec.id,skor:skor,waktu:wk,lulus:lulus,dual:r.dual,log:log,exam:exam});
    AU.post();AU.win();
    if(A()){A().focus('case');A().setPower(true,[{t:'TJKT-BIOS v1.0',c:'#ffffff'},{t:'CPU ........ terdeteksi'},{t:'Memori .... '+(SIM.ramCount(S)*8)+' GB '+(r.dual?'(Dual Channel)':'(Single)')},{t:'NVMe SSD .. terdeteksi'},{t:'GPU ........ PCIe x16 aktif'},{t:'Suhu CPU ... 38 C'},{t:'POST: BERHASIL',c:'#ffffff'},{t:'Tekan DEL untuk masuk BIOS',c:'#6c8f7c'}])}
    setFb({kind:'ok',title:'POST berhasil',msg:exam?'Komputer menyala dan lolos Power-On Self-Test. Rapor evaluasi tampil di panel kanan.':'Komputer menyala dan lolos Power-On Self-Test. Lihat hasil praktikmu di panel kanan.'});
  }
  function setProf(k,v){
    var np=Object.assign({},p.profile);np[k]=v;p.setProfile(np);
    if(done)p.setHistory(function(h){return h.map(function(r){return r.id===done.id?Object.assign({},r,{nama:np.nama||'Tanpa nama',kelas:np.kelas||'-'}):r})});
  }

  var glow=(practice&&sel)?SIM.goodTarget(S,sel):null;
  useEffect(function(){var a=A();if(a){a.setHint(glow);a.setPractice(practice)}},[glow,practice,sel]);
  useEffect(function(){var a=A();if(a)a.setTheme(!!p.dark)},[p.dark,flat,nonce]);
  useEffect(function(){
    var a=A();if(!a||!practice||done)return;
    var it=sel||(k3done?next.item:null);
    if(it)a.focusItem(it);
  },[sel,sceneKey,practice,k3done,nonce]);
  useEffect(function(){var a=A();if(a)a.focus(practice?'work':'case',true)},[nonce]);
  function stepsList(){return [
    ['Lengkapi checklist K3LH',SIM.k3ok(S)],['Letakkan motherboard di meja kerja',S.mobo!=='tray'],['Pasang CPU',S.cpu],['Oleskan thermal paste',S.paste],['Pasang CPU cooler',S.cooler],
    ['Pasang RAM (Dual Channel)',SIM.ramCount(S)>=1],['Pasang SSD NVMe M.2',S.ssd],['Pasang I/O Shield',S.io],['Pasang motherboard ke casing',S.mobo==='case'],
    ['Pasang PSU',S.psu],['Pasang VGA Card',S.vga],['Sambung kabel 24-pin ATX',S.c24],['Sambung kabel CPU 8-pin',S.c8],['Sambung kabel Front Panel',S.fp],['Tekan tombol power (POST)',!!done]]}
  var allTargets=['bench','caseBay','socket','dimm0','dimm1','dimm2','dimm3','m2','pcie','io','psuBay','atx24','eps','fph'];

  return html`<div>
    <div className="simbar">
      <div className="seg" role="group" aria-label="Mode simulasi">
        <button aria-pressed=${practice} onClick=${function(){changeMode('latihan')}}><${Icon} n="bulb" s=${17}/> Mode Latihan</button>
        <button aria-pressed=${!practice} onClick=${function(){changeMode('ujian')}}><${Icon} n="shield" s=${17}/> Mode Ujian</button>
      </div>
      <div className="stats">
        <div className="stat"><small>Waktu</small><b>${fmtTime(elapsed)}</b></div>
        <div className="stat"><small>Skor akurasi</small><b>${score}</b></div>
        <div className="stat"><small>Kesalahan</small><b>${errors}</b></div>
        <div className="stat"><small>K3LH</small><b style=${{color:k3done?'var(--ok)':'var(--warn)',fontSize:14}}>${k3done?'Aman':k3count+'/3'}</b></div>
      </div>
      <div style=${{display:'flex',gap:8}}>
        <button className="btn sm" onClick=${function(){setSnd(function(v){return !v})}} aria-label=${snd?'Matikan suara':'Nyalakan suara'}><${Icon} n=${snd?'sound':'mute'} s=${17}/></button>
        <button className="btn sm" onClick=${function(){reset(mode)}}><${Icon} n="reset" s=${16}/> Reset Perakitan</button>
      </div>
    </div>

    <div className="simgrid">
      <div className="panel tray">
        <h3>Panel Komponen</h3>
        <div className="k3list">
          ${[['esd','Gelang ESD terpasang'],['mat','Alas kerja non-konduktif'],['tool','Obeng magnetik siap']].map(function(k){
            return html`<button key=${k[0]} className="k3b" aria-pressed=${S.k3[k[0]]} onClick=${function(){toggleK3(k[0])}}><span className="bx">${S.k3[k[0]]?html`<${Icon} n="check" s=${13}/>`:null}</span>${k[1]}</button>`})}
        </div>
        <div className="chips">${order.map(function(id,oi){
          var it=SIM.ITEMS[id];
          var used=SIM.itemDone(S,id);
          var sub=it.sub;
          if(practice){
            if(id==='mobo')sub=S.mobo==='tray'?'Letakkan di meja':(S.mobo==='bench'?'Pindahkan ke casing':'Terpasang');
            if(id==='ram')sub=SIM.ramCount(S)+' terpasang (maks. 2)';
          }
          return html`<button key=${id} className=${'chip'+(used?' used':'')+((practice&&k3done&&next.item===id&&!done)?' next':'')} aria-pressed=${sel===id} onClick=${function(){pick(id)}}>
            <span className="ico"><${Icon} n=${used?'check':it.ikon} s=${17}/></span><span style=${{minWidth:0}}>${practice?(oi+1)+'. ':''}${it.nama}<small>${sub}</small></span></button>`})}</div>
      </div>

      <div className=${'panel stage'+(full?' fs':'')}>
        <div className=${'fb '+fb.kind} role="status" aria-live="polite">
          <${Icon} n=${fb.kind==='ok'?'check':(fb.kind==='err'?'warn':(fb.kind==='warn'?'warn':'info'))} s=${22}/>
          <div><b>${fb.kind==='err'?'Peringatan Edukatif':fb.title}</b>${fb.kind==='err'?html`<span><strong>${fb.title}.</strong> </span>`:null}${fb.msg}</div>
        </div>
        <${Stage3D} full=${full} onFull=${toggleFull} onK3=${toggleK3} ready=${ready} done=${done} toast=${toast} S=${S} sel=${sel} glow=${glow} running=${running} onTarget=${onTarget} onPower=${pressPower} cbs=${cbs} apiRef=${apiRef} practice=${practice} activeItem=${sel||next.item} onFail=${function(){setFlat(true)}}/>
        ${sel&&!done&&practice?html`<div className="tgtbar"><span>Terpilih: <b>${SIM.ITEMS[sel].nama}</b>. Ketuk slot di gambar atau pilih di sini:</span>
          ${allTargets.filter(function(t){return !(t==='bench'&&S.mobo!=='tray')}).map(function(t){return html`<button key=${t} className="tg" onClick=${function(){onTarget(t,false)}}>${SIM.TARGETS[t]}</button>`})}</div>`:null}
        <div className="powerrow">
          <button className=${'btn powerbtn'+(ready&&!done?' ready':'')} onClick=${pressPower} disabled=${!!done}><${Icon} n="power" s=${20}/> Tekan Tombol Power PC</button>
          <span style=${{fontSize:13,color:'var(--muted)'}}>${done?'PC sudah menyala. Tekan Reset Perakitan untuk mengulang.':(ready?'Semua komponen wajib terpasang. Siap uji nyala.':'Tombol aktif penuh setelah semua komponen wajib terpasang.')}</span>
        </div>
      </div>

      <div className="side">
        ${practice&&!done?html`<div className="next-box"><b><${Icon} n="bulb" s=${17}/> Langkah berikutnya</b>${next.text}</div>`:null}
        ${practice?html`<div className="panel" style=${{padding:10}}><h3>Panduan Langkah</h3>
          <ol className="stepl">${stepsList().map(function(st,i,arr){
            var cur=!st[1]&&arr.findIndex(function(x){return !x[1]})===i;
            return html`<li key=${i} className=${(st[1]?'d ':'')+(cur?'c':'')}><span className="sn">${st[1]?html`<${Icon} n="check" s=${12}/>`:(i+1)}</span>${st[0]}</li>`})}</ol></div>`:null}
        ${exam&&!done?html`<div className="next-box"><b><${Icon} n="shield" s=${17}/> Mode Ujian Mandiri</b>Tidak ada petunjuk, urutan, maupun slot yang menyala. Setiap pelanggaran teknis dicatat dan mengurangi skor 5 poin (K3LH 3 poin). Kompeten jika skor minimal 75. Rapor muncul setelah tombol power ditekan dengan rakitan yang benar.</div>`:null}
        <div className="monitor"><div className="screen" aria-label="Layar monitor simulasi">
          ${!done?html`<div><span className="dim">NO SIGNAL</span><br/><span className="dim">Rakit PC lalu tekan tombol power.</span></div>`:html`<div>
            <div className="row okl">TJKT-BIOS v1.0</div>
            <div className="row" style=${{animationDelay:'.15s'}}>CPU ........ terdeteksi</div>
            <div className="row" style=${{animationDelay:'.3s'}}>Memori .... ${SIM.ramCount(S)*8} GB ${done.dual?'(Dual Channel)':'(Single Channel)'}</div>
            <div className="row" style=${{animationDelay:'.45s'}}>NVMe SSD .. terdeteksi</div>
            <div className="row" style=${{animationDelay:'.6s'}}>GPU ........ PCIe x16 aktif</div>
            <div className="row" style=${{animationDelay:'.75s'}}>Suhu CPU ... 38 C</div>
            <div className="row okl" style=${{animationDelay:'.95s',marginTop:6}}>POST: BERHASIL</div>
            <div className="row dim" style=${{animationDelay:'1.1s'}}>Tekan DEL untuk masuk BIOS</div></div>`}
        </div></div>
        ${done?html`<div className=${'result'+(done.lulus?'':' fail')}>
          <h3>${done.exam?'Rapor Evaluasi Ujian Mandiri':'Kartu Hasil Praktik'}</h3>
          <div style=${{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}><div className="score">${done.skor}<span style=${{fontSize:16,fontWeight:500}}> / 100</span></div>
            <span className=${'pill '+(done.lulus?'ok':'bad')}>${done.exam?(done.lulus?'KOMPETEN':'BELUM KOMPETEN'):(done.lulus?'LULUS (KKM 75)':'BELUM LULUS')}</span></div>
          <div className="kv"><div>Waktu<b>${fmtTime(done.waktu)}</b></div><div>Kesalahan<b>${done.log.length}</b></div><div>Mode<b style=${{fontSize:13}}>${done.exam?'Ujian':'Latihan'}</b></div><div>RAM<b style=${{fontSize:13}}>${done.dual?'Dual Channel':'Single'}</b></div></div>
          <label className="fld" htmlFor="in-nama">Nama siswa<input id="in-nama" type="text" value=${p.profile.nama||''} placeholder="Tulis nama lengkap" onChange=${function(e){setProf('nama',e.target.value)}}/></label>
          <label className="fld" htmlFor="in-kelas">Kelas<input id="in-kelas" type="text" value=${p.profile.kelas||''} placeholder="Contoh: X TJKT 1" onChange=${function(e){setProf('kelas',e.target.value)}}/></label>
          <h3 style=${{fontSize:14,marginTop:14,marginBottom:0}}>Rincian Kesalahan Teknis (${done.log.length})</h3>
          ${done.log.length?html`<ul className="errl">${done.log.map(function(l,i){return html`<li key=${i}><b>${fmtTime(l.t)} | ${l.judul} (-${l.poin})</b><small>${l.rincian}</small></li>`})}</ul>`:html`<p style=${{fontSize:13,marginTop:6}}>Tidak ada pelanggaran teknis tercatat.</p>`}
          <p style=${{fontSize:12.5,color:'var(--muted)',marginTop:8}}>Hasil dan rincian kesalahan sudah tersimpan otomatis di riwayat perangkat ini.</p>
        </div>`:null}
      </div>
    </div>

    <div style=${{marginTop:22}}>
      <div className="sec-h"><div><h2 style=${{fontSize:20}}>Riwayat Praktik</h2><p>Disimpan di perangkat ini dan tetap ada walau aplikasi ditutup atau offline.</p></div>
        ${p.history.length?(confirmClr?html`<div style=${{display:'flex',gap:8,alignItems:'center'}}><span style=${{fontSize:13}}>Hapus semua riwayat?</span><button className="btn sm" onClick=${function(){p.setHistory([]);setConfirmClr(false)}}>Ya, hapus</button><button className="btn sm" onClick=${function(){setConfirmClr(false)}}>Batal</button></div>`:html`<button className="btn sm" onClick=${function(){setConfirmClr(true)}}><${Icon} n="trash" s=${15}/> Hapus riwayat</button>`):null}
      </div>
      ${p.history.length?html`<div className="tbl"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Kelas</th><th>Mode</th><th>Skor</th><th>Waktu</th><th>Salah</th><th>Status</th><th>Rincian</th></tr></thead>
        <tbody>${p.history.slice(0,10).map(function(r){return html`<tr key=${r.id}><td>${fmtDate(r.tgl)}</td><td>${r.nama}</td><td>${r.kelas}</td><td>${r.mode==='ujian'?'Ujian':'Latihan'}</td><td><b>${r.skor}</b></td><td>${fmtTime(r.waktu)}</td><td>${r.kesalahan}</td><td><span className=${'pill '+(r.lulus?'ok':'bad')}>${r.mode==='ujian'?(r.lulus?'Kompeten':'Belum kompeten'):(r.lulus?'Lulus':'Belum lulus')}</span></td><td><button className="btn sm" onClick=${function(){setDetail(r)}}>Lihat</button></td></tr>`})}</tbody></table></div>`
        :html`<div className="tbl"><div className="empty">Belum ada riwayat. Selesaikan satu perakitan sampai POST berhasil untuk menyimpan hasil pertamamu.</div></div>`}
    </div>
    ${detail?html`<${Modal} label="Rincian kesalahan" onClose=${function(){setDetail(null)}}>
      <div className="modal-h"><div><h2>Rincian ${detail.mode==='ujian'?'Ujian':'Latihan'}</h2><p style=${{color:'var(--muted)',fontSize:14}}>${detail.nama} | ${detail.kelas} | Skor ${detail.skor} | ${fmtTime(detail.waktu)}</p></div>
        <button className="btn sm" onClick=${function(){setDetail(null)}} aria-label="Tutup"><${Icon} n="x" s=${18}/></button></div>
      ${(detail.log&&detail.log.length)?html`<ul className="errl">${detail.log.map(function(l,i){return html`<li key=${i}><b>${fmtTime(l.t)} | ${l.judul} (-${l.poin})</b><small>${l.rincian}</small></li>`})}</ul>`:html`<p>Tidak ada pelanggaran teknis tercatat pada sesi ini.</p>`}
    <//>`:null}
    ${fpOpen?html`<${FrontPanelModal} S=${S} practice=${practice} onClose=${function(){setFpOpen(false)}} onDone=${fpDone} onWrong=${function(){penalize(5,'Pin Front Panel tertukar','Kabel Front Panel disambungkan ke pin header yang salah.')}} exam=${exam}/>`:null}
  </div>`;
}

/* ---------- Panduan install ---------- */
function InstallModal(p){
  return html`<${Modal} label="Panduan instal aplikasi" onClose=${p.onClose}>
    <div className="modal-h"><div><h2>Instal Aplikasi (Mode Offline)</h2><p style=${{color:'var(--muted)',fontSize:14}}>Pasang PerakitPC TJKT seperti aplikasi biasa. Setelah dimuat sekali dengan internet, aplikasi bisa dibuka tanpa internet.</p></div>
      <button className="btn sm" onClick=${p.onClose} aria-label="Tutup"><${Icon} n="x" s=${18}/></button></div>
    <div className="guide">
      <h4>PC atau laptop (Chrome / Edge)</h4>
      <ol><li>Klik ikon instal di ujung kanan kolom alamat, atau menu titik tiga lalu <b>Instal PerakitPC TJKT</b> (Chrome) / <b>Aplikasi, Instal situs ini sebagai aplikasi</b> (Edge).</li><li>Aplikasi terbuka di jendela sendiri dan muncul di menu Start atau Desktop.</li></ol>
      <h4>Android (Chrome)</h4>
      <ol><li>Ketuk menu titik tiga di kanan atas.</li><li>Pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b> (Add to Home screen).</li><li>Ketuk <b>Instal</b>.</li></ol>
      <h4>iPhone / iPad (Safari)</h4>
      <ol><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).</li><li>Pilih <b>Tambah ke Layar Utama</b> (Add to Home Screen), lalu <b>Tambah</b>.</li></ol>
      <h4>Tanpa internet sama sekali</h4>
      <ol><li>Buka aplikasi sekali saat online agar berkas pendukung (React, Tailwind, font) tersimpan.</li><li>Atau simpan berkas <b>perakitpc-tjkt.html</b> dari gurumu, lalu buka lewat browser. Penggunaan sepenuhnya offline paling stabil jika berkas diletakkan di server sekolah (HTTPS) bersama <b>sw.js</b>.</li></ol>
      <div className="fb info" style=${{marginTop:14,marginBottom:0}}><${Icon} n="info" s=${20}/><div><b>Status saat ini</b>Koneksi: ${navigator.onLine?'online':'offline'}. Cache offline (service worker): ${PWA.sw}. Progres belajar dan riwayat tersimpan otomatis di perangkat ini.</div></div>
    </div>
  <//>`;
}

/* ---------- App ---------- */
function App(){
  var _t=useState(function(){return LS.get('tjkt_pc_tab','materi')}),tab=_t[0],setTab=_t[1];
  var _pg=useState(function(){return LS.get('tjkt_pc_progress',{dibaca:[],sop:{}})}),prog=_pg[0],setProg=_pg[1];
  var _h=useState(function(){return LS.get('tjkt_pc_riwayat',[])}),history=_h[0],setHistory=_h[1];
  var _pf=useState(function(){return LS.get('tjkt_pc_siswa',{nama:'',kelas:''})}),profile=_pf[0],setProfile=_pf[1];
  var _in=useState(false),instOpen=_in[0],setInstOpen=_in[1];
  var _tick=useState(0),tick=_tick[1];
  var _th=useState(function(){return LS.get('tjkt_pc_tema','')}),theme=_th[0],setTheme=_th[1];

  useEffect(function(){LS.set('tjkt_pc_tab',tab)},[tab]);
  useEffect(function(){LS.set('tjkt_pc_progress',prog)},[prog]);
  useEffect(function(){LS.set('tjkt_pc_riwayat',history)},[history]);
  useEffect(function(){LS.set('tjkt_pc_siswa',profile)},[profile]);
  useEffect(function(){
    var r=document.documentElement;if(theme)r.setAttribute('data-theme',theme);else r.removeAttribute('data-theme');
    LS.set('tjkt_pc_tema',theme);
  },[theme]);
  useEffect(function(){PWA.on(function(){tick(function(x){return x+1})});PWA.setupManifest();PWA.registerSW()},[]);

  var dark=theme?theme==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  var installed=PWA.installed||PWA.standalone();
  var online=navigator.onLine;
  function doInstall(){
    if(PWA.deferred)PWA.promptInstall().then(function(o){if(o==='manual')setInstOpen(true)});
    else setInstOpen(true);
  }
  var totalSteps=SOP.reduce(function(a,b){return a+b.steps.length},0);
  var doneSteps=Object.keys(prog.sop||{}).filter(function(k){return prog.sop[k]}).length;
  var pct=Math.round(((prog.dibaca||[]).length+doneSteps)/(HW.length+totalSteps)*100);

  return html`<div>
    <header className="hdr"><div className="hdr-in">
      <div className="brand"><div className="logo"><${Icon} n="cpu" s=${22}/></div>
        <div style=${{minWidth:0}}><h1>PerakitPC TJKT</h1><small>Simulasi perakitan PC dan pengenalan komponen. Progres belajar ${pct}%</small></div></div>
      <div className="hdr-act">
        <span className=${'pill '+(online?'ok':'warn')}><${Icon} n=${online?'wifi':'wifioff'} s=${14}/> ${online?'Online':'Offline'}</span>
        ${installed?html`<span className="pill acc"><${Icon} n="check" s=${14}/> Terpasang</span>`:html`<button className="btn pri" onClick=${doInstall}><${Icon} n="download" s=${17}/> Install Aplikasi (Offline)</button>`}
        <button className="btn" onClick=${function(){setTheme(dark?'light':'dark')}} aria-label=${dark?'Tema terang':'Tema gelap'}><${Icon} n=${dark?'sun':'moon'} s=${18}/></button>
      </div>
    </div></header>
    <div className="wrap">
      <div className="tabs" role="tablist">
        <button className="tab" role="tab" aria-selected=${tab==='materi'} onClick=${function(){setTab('materi')}}><${Icon} n="book" s=${19}/> Materi Pembelajaran</button>
        <button className="tab" role="tab" aria-selected=${tab==='sim'} onClick=${function(){setTab('sim')}}><${Icon} n="wrench" s=${19}/> Simulasi Perakitan</button>
      </div>
      <main className="main" role="tabpanel">
        ${tab==='materi'?html`<${Materi} prog=${prog} setProg=${setProg}/>`:html`<${Sim} dark=${dark} profile=${profile} setProfile=${setProfile} history=${history} setHistory=${setHistory}/>`}
      </main>
      <div className="foot">Dibuat untuk siswa SMK TJKT. Data progres dan riwayat hanya tersimpan di perangkat ini. Versi 4.2 (rak 2: hanya kepala kabel).</div>
    </div>
    ${instOpen?html`<${InstallModal} onClose=${function(){setInstOpen(false)}}/>`:null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>

</body>
</html>
